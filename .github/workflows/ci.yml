name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal bench)"
      - name: vet
        run: go vet ./...
      - name: tracked-only build
        run: |
          mkdir -p /tmp/tracked-src
          git archive HEAD | tar -x -C /tmp/tracked-src
          (cd /tmp/tracked-src && go build ./... && go vet ./...)
      - name: test
        run: go test ./... -count=1

  race:
    name: race (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: test -race
        run: go test -race ./... -count=1

  cross-build:
    name: build (windows/linux/darwin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: cross build
        run: |
          for os in darwin linux windows; do
            GOOS=$os GOARCH=amd64 go build -o /dev/null ./... || exit 1
          done

  bench-mock:
    name: benchmark harness (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: install pytest (polyglot suite acceptance)
        run: |
          python3 -m pip install --quiet --break-system-packages pytest ||
            python3 -m pip install --quiet --user pytest
      - name: harness self-test (resume A/B)
        run: go run ./bench/ab --mock-agent --trials 1 --arm both --out /tmp/ab
      - name: harness self-test (polyglot)
        run: go run ./bench/polyglot --mock-agent --polyglot-dir bench/fixtures/polyglot --trials 1 --arm both --out /tmp/poly
